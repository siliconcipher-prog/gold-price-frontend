name: Update Gold Prices

on:
schedule:
  - cron: "30 0 * * *"   # 06:00 IST
  - cron: "30 2 * * *"   # 08:00 IST
  - cron: "0 5 * * *"    # 10:30 IST
  - cron: "30 7 * * *"   # 13:00 IST
  - cron: "30 11 * * *"  # 17:00 IST
  - cron: "30 15 * * *"  # 21:00 IST
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate price JSON
        run: node scripts/generateSlabs.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit updates
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "Auto update gold prices" || echo "No changes"
          git push