name: Daily Gold Price Pipeline

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
    - cron: "0 5 * * *"    # 10:30 IST
    - cron: "30 11 * * *"  # 17:00 IST
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Python Scraper
      # -------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.scraper.txt
          python -m playwright install chromium

      - name: Run scraper
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python rate_scraper_V4.py

      # -------------------------
      # Generate slabs.json
      # -------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Generate slabs.json
        run: node scripts/generateSlabs.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

