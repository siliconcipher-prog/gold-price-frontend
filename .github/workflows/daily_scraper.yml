name: Daily Gold Price Pipeline

on:
  schedule:
    # Run every 30 minutes; rate_scraper_V4.py skips outside the allowed IST windows.
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:

      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # -------------------------
      # Python Scraper
      # -------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check execution window
        id: schedule
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python rate_scraper_V4.py --check-window >> "$GITHUB_OUTPUT"

      - name: Skip outside execution window
        if: steps.schedule.outputs.should_run != 'true'
        run: echo "Skipping pipeline - outside allowed IST execution window."

      - name: Install scraper dependencies
        if: steps.schedule.outputs.should_run == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.scraper.txt
          python -m playwright install chromium

      - name: Run scraper
        if: steps.schedule.outputs.should_run == 'true'
        env:
          PG_DSN: ${{ secrets.PG_DSN }}
          PYTHONUNBUFFERED: "1"
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          python rate_scraper_V4.py

      # -------------------------
      # Generate slabs.json
      # -------------------------

      - name: Setup Node
        if: steps.schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        if: steps.schedule.outputs.should_run == 'true'
        run: npm install

      - name: Generate slabs.json
        if: steps.schedule.outputs.should_run == 'true'
        run: node scripts/generateSlabs.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

